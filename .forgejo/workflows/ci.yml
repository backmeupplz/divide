name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Production builds the Dockerfile; its FROM lines must use this same version.
  BUN_VERSION: 1.4.4

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile uses the CI Bun version
        run: |
          froms=$(grep -E '^FROM ' Dockerfile)
          echo "$froms"
          if [ -z "$froms" ] || echo "$froms" | grep -v -E "^FROM oven/bun:${BUN_VERSION}-slim( AS [a-z]+)?$"; then
            echo "::error file=Dockerfile::every FROM must be oven/bun:${BUN_VERSION}-slim"
            exit 1
          fi
      - if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Mac: Bun installed once per runner tool cache, checked against the release's SHASUMS256.txt
      - if: runner.os == 'macOS'
        run: |
          dir="$RUNNER_TOOL_CACHE/bun/$BUN_VERSION"
          if [ ! -x "$dir/bun" ]; then
            curl -fsSL -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-darwin-aarch64.zip"
            want=$(curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/SHASUMS256.txt" | awk '$2 == "bun-darwin-aarch64.zip" {print $1}')
            got=$(shasum -a 256 "$RUNNER_TEMP/bun.zip" | cut -d' ' -f1)
            [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::Bun $BUN_VERSION doesn't match its SHASUMS256.txt"; exit 1; }
            rm -rf "$dir" && mkdir -p "$dir"
            unzip -j -q "$RUNNER_TEMP/bun.zip" -d "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
