<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c16">
    <link rel="icon" href="/icon.png">
    <title>The Network Divide</title>
    <!--divide-meta-->
  </head>
  <body>
    <div id="boot" style="position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 40%,#2b1a35,#0b0e1c 70%);font:600 15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#a6acc9">
      <div style="font-size:13px;letter-spacing:.3em;color:#ff4fa3">— THE —</div>
      <div style="font-size:clamp(34px,9vw,64px);font-weight:900;line-height:.95;text-align:center;background:linear-gradient(#ffd27a,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,122,26,.35))">Network<br>Divide</div>
      <div class="boot-bar" style="width:min(70vw,260px);height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden"><i style="display:block;height:100%;width:30%;border-radius:2px;background:linear-gradient(90deg,#9b5cff,#ff2f8e);transition:width .3s;animation:bootslide 1.1s ease-in-out infinite"></i></div>
      <div class="boot-msg">Joining the network…</div>
      <script>
        // if the game never starts (an old browser, a blocked script), say so instead of loading forever
        setTimeout(function () {
          var m = document.querySelector('#boot .boot-msg'), b = document.querySelector('#boot .boot-bar')
          if (!m || !document.getElementById('boot') || m.textContent.indexOf('Joining') < 0) return
          if (b) b.style.display = 'none'
          m.innerHTML = '<b style="display:block;color:#fff;font-size:17px;margin-bottom:6px">The game could not start</b>Try reloading, or open it in an up-to-date browser with JavaScript and WebGL on.'
        }, 30000)
      </script>
      <style>@keyframes bootslide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}#boot .boot-bar i.known{animation:none}</style>
    </div>
    <div id="sky"></div>
    <canvas id="game"></canvas>
    <div id="city"></div>
    <div class="rain" aria-hidden="true"></div>
    <div id="ui"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
